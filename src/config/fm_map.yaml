# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in
# docs/failure_taxonomy.md. A mechanism the taxonomy lacks would be a new failure mode.
ticket_over_db: FM-03          # ticket text (injection, false fact, authority) overrides DB facts
stale_policy: FM-06            # superseded / not-yet-effective clause used as current
clause_sum: FM-04              # sums clause parts instead of max_of_eligible
double_deduct: FM-05           # agent subtracts prior refunds itself; host subtracts again
sibling_refund: FM-07          # money written under a sibling claim on the same order
denied_ignored: FM-02          # host denial (expired approval, already refunded) reported as resolved
reply_ledger_mismatch: FM-08   # reply states the quote, ledger holds the capped amount
cross_principal: FM-09         # acts on / reveals another principal's order
